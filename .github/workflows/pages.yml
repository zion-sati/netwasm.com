name: Pages

on:
  workflow_dispatch:
    inputs:
      coordinated_stage:
        required: true
        type: string
      preparation_sha256:
        required: true
        type: string
      release_id:
        required: false
        default: ''
        type: string
      release_ref:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      infrastructure_commit:
        required: true
        type: string
      coordinator_repository:
        required: true
        type: string
      coordinator_run_id:
        required: true
        type: string
      coordinator_run_attempt:
        required: true
        type: string
      stage_identity:
        required: true
        type: string
      dispatch_attempt_identity:
        required: true
        type: string
      upstream_receipts:
        required: true
        type: string
      retained_candidates:
        required: true
        type: string
      preparation_release_id:
        required: true
        type: string

run-name: Release website ${{ inputs.stage_identity }}

permissions:
  actions: read
  contents: read

concurrency:
  group: website-release-${{ inputs.stage_identity }}
  cancel-in-progress: false

jobs:
  receive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      dispatch_artifact: coordinated-inputs-${{ inputs.stage_identity }}-${{ github.run_attempt }}
      infrastructure_commit: ${{ steps.receiver.outputs.infrastructure_commit }}
      playground_completion_sha256: ${{ steps.upstream.outputs.playground_completion_sha256 }}
      retained_artifact: ${{ steps.retained.outputs.artifact_name }}
      retained_site: ${{ steps.retained.outputs.site }}
      source_commit: ${{ steps.receiver.outputs.source_commit }}
      version: ${{ steps.receiver.outputs.version }}
    steps:
      - name: Reject native production reruns
        shell: bash
        run: |
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo 'Native production reruns are not supported. Resume through a fresh coordinator dispatch so retained candidates are authenticated.' >&2
            exit 1
          fi

      - name: Check out trusted receiver
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: bootstrap

      - name: Check out prepared website source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Download coordinated release evidence
        id: upstream
        shell: bash
        env:
          COORDINATOR_REPOSITORY: ${{ inputs.coordinator_repository }}
          GH_TOKEN: ${{ github.token }}
          PREPARATION_RELEASE_ID: ${{ inputs.preparation_release_id }}
          RETAINED_CANDIDATES: ${{ inputs.retained_candidates }}
          UPSTREAM_RECEIPTS: ${{ inputs.upstream_receipts }}
        run: |
          set -euo pipefail
          test "$COORDINATOR_REPOSITORY" = zion-sati/NetWasm
          [[ "$PREPARATION_RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          root="$GITHUB_WORKSPACE/artifacts/dispatch"
          mkdir -p "$root/upstream" "$root/upstream-runs" "$root/retained"
          gh api "repos/${COORDINATOR_REPOSITORY}/releases/${PREPARATION_RELEASE_ID}" \
            > "$root/release.json"

          download_release_asset() {
            local name="$1"
            local output="$2"
            local asset_id
            asset_id="$(jq --arg name "$name" \
              '[.assets[] | select(.name == $name)] | if length == 1 then .[0].id else error("release asset is missing or ambiguous") end' \
              "$root/release.json")"
            [[ "$asset_id" =~ ^[1-9][0-9]*$ ]]
            gh api -H 'Accept: application/octet-stream' \
              "repos/${COORDINATOR_REPOSITORY}/releases/assets/${asset_id}" > "$output"
          }

          download_release_asset release-preparation.json "$root/release-preparation.json"
          while IFS= read -r coordinate; do
            stage="$(jq -r '.stage' <<< "$coordinate")"
            name="$(jq -r '.fileName' <<< "$coordinate")"
            test "$stage" = playground
            [[ "$name" =~ ^[A-Za-z0-9._-]+$ ]]
            receipt="$root/upstream/$name"
            download_release_asset "$name" "$receipt"
            repository="$(jq -r '.repository' "$receipt")"
            run_id="$(jq -r '.producer.runId' "$receipt")"
            run_attempt="$(jq -r '.producer.runAttempt' "$receipt")"
            [[ "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/${repository}/actions/runs/${run_id}/attempts/${run_attempt}" \
              > "$root/upstream-runs/$stage.json"
            gh api "repos/${repository}/actions/runs/${run_id}/attempts/${run_attempt}/jobs?per_page=100" \
              > "$root/upstream-runs/$stage-jobs.json"
            echo "playground_completion_sha256=$(sha256sum "$receipt" | cut -d ' ' -f 1)" \
              >> "$GITHUB_OUTPUT"
          done < <(jq -c '.[]' <<< "$UPSTREAM_RECEIPTS")

          while IFS= read -r candidate; do
            kind="$(jq -r '.kind' <<< "$candidate")"
            expected="$(jq -r '.receiptSha256' <<< "$candidate")"
            test "$kind" = website-site-candidate
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
            directory="$root/retained/$kind"
            mkdir -p "$directory"
            download_release_asset "delivery-candidate-${kind}.json" \
              "$directory/delivery-candidate-receipt.json"
            test "$(sha256sum "$directory/delivery-candidate-receipt.json" | cut -d ' ' -f 1)" = "$expected"
            archive="$(jq -r '.archive.fileName' "$directory/delivery-candidate-receipt.json")"
            [[ "$archive" =~ ^[A-Za-z0-9._-]+$ ]]
            download_release_asset "$archive" "$directory/$archive"
          done < <(jq -c '.[]' <<< "$RETAINED_CANDIDATES")
          jq -c '.inputs' "$GITHUB_EVENT_PATH" > "$root/inputs.json"

      - name: Resolve Core preview tag
        id: release-tag
        shell: bash
        env:
          COORDINATOR_REPOSITORY: ${{ inputs.coordinator_repository }}
        run: |
          set -euo pipefail
          release_tag="$(jq -r '.tag_name' artifacts/dispatch/release.json)"
          tag_ref="refs/tags/$release_tag"
          git check-ref-format "$tag_ref"
          git init -q anchor
          git -C anchor remote add origin "https://github.com/${COORDINATOR_REPOSITORY}.git"
          git -C anchor fetch --force --no-tags origin "$tag_ref:$tag_ref"
          tag_commit="$(python3 bootstrap/eng/actions-delivery.py tag-commit \
            --repository anchor \
            --tag "$release_tag")"
          test -n "$tag_commit"
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Verify coordinated receiver identity
        id: receiver
        shell: bash
        env:
          APPROVED_ACTOR_ID: ${{ vars.RELEASE_APP_ACTOR_ID }}
        run: |
          python3 bootstrap/eng/release-receiver.py \
            --inputs artifacts/dispatch/inputs.json \
            --preparation artifacts/dispatch/release-preparation.json \
            --release artifacts/dispatch/release.json \
            --upstream-directory artifacts/dispatch/upstream \
            --upstream-run-directory artifacts/dispatch/upstream-runs \
            --repository "$GITHUB_REPOSITORY" \
            --event-name "$GITHUB_EVENT_NAME" \
            --workflow-identity "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$GITHUB_SHA" \
            --workflow-ref "$GITHUB_REF_NAME" \
            --actor-id "$GITHUB_ACTOR_ID" \
            --approved-actor-id "$APPROVED_ACTOR_ID" \
            --tag-commit '${{ steps.release-tag.outputs.commit }}' \
            --output artifacts/dispatch/receiver.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Check out approved delivery infrastructure
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.receiver.outputs.infrastructure_commit }}
          persist-credentials: false
          path: infrastructure

      - name: Verify prepared source and infrastructure
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          source_commit="$(git -C source rev-parse HEAD)"
          infrastructure_commit="$(git -C infrastructure rev-parse HEAD)"
          test "$source_commit" = '${{ steps.receiver.outputs.source_commit }}'
          test "$infrastructure_commit" = '${{ steps.receiver.outputs.infrastructure_commit }}'
          git -C source fetch --force origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          git -C source merge-base --is-ancestor \
            "$source_commit" "refs/remotes/origin/${DEFAULT_BRANCH}"

      - name: Verify retained website candidate
        id: retained
        shell: bash
        env:
          RETAINED_CANDIDATES: ${{ inputs.retained_candidates }}
        run: |
          set -euo pipefail
          count="$(jq 'length' <<< "$RETAINED_CANDIDATES")"
          site=false
          artifact_name=""
          if [[ "$count" == 1 ]]; then
            kind=website-site-candidate
            directory="artifacts/dispatch/retained/$kind"
            receipt="$directory/delivery-candidate-receipt.json"
            archive="$(jq -r '.archive.fileName' "$receipt")"
            expected="$(jq -r '.[0].receiptSha256' <<< "$RETAINED_CANDIDATES")"
            python3 infrastructure/eng/website-delivery.py verify-candidate \
              --preparation artifacts/dispatch/release-preparation.json \
              --inputs artifacts/dispatch/inputs.json \
              --receipt "$receipt" \
              --archive "$directory/$archive" \
              --upstream-directory artifacts/dispatch/upstream \
              --expected-receipt-sha256 "$expected"
            site=true
            artifact_name="retained-website-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          elif [[ "$count" != 0 ]]; then
            echo 'Website retained candidate list is invalid.' >&2
            exit 1
          fi
          {
            echo "artifact_name=$artifact_name"
            echo "count=$count"
            echo "site=$site"
          } >> "$GITHUB_OUTPUT"

      - name: Retain coordinated dispatch evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coordinated-inputs-${{ inputs.stage_identity }}-${{ github.run_attempt }}
          path: |
            artifacts/dispatch/inputs.json
            artifacts/dispatch/receiver.json
            artifacts/dispatch/release-preparation.json
            artifacts/dispatch/release.json
            artifacts/dispatch/upstream/
            artifacts/dispatch/upstream-runs/
          if-no-files-found: error
          retention-days: 90

      - name: Retain recovered website candidate
        if: steps.retained.outputs.count == '1'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.retained.outputs.artifact_name }}
          path: artifacts/dispatch/retained/
          if-no-files-found: error
          retention-days: 90

  site-candidate:
    needs: receive
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      archive_name: ${{ steps.verified.outputs.archive_name }}
      artifact_name: resolved-website-site-${{ github.run_id }}-${{ github.run_attempt }}
      index_html_sha256: ${{ steps.verified.outputs.index_html_sha256 }}
      receipt_sha256: ${{ steps.verified.outputs.receipt_sha256 }}
      site_identity_sha256: ${{ steps.verified.outputs.site_identity_sha256 }}
    steps:
      - name: Reject native production reruns
        shell: bash
        run: |
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo 'Native production reruns are not supported. Resume through a fresh coordinator dispatch so retained candidates are authenticated.' >&2
            exit 1
          fi

      - name: Check out prepared website source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.receive.outputs.source_commit }}
          persist-credentials: false
          path: source

      - name: Check out approved delivery infrastructure
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.receive.outputs.infrastructure_commit }}
          persist-credentials: false
          path: infrastructure

      - name: Download coordinated dispatch evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.receive.outputs.dispatch_artifact }}
          path: artifacts/dispatch

      - name: Download retained website candidate
        if: needs.receive.outputs.retained_site == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.receive.outputs.retained_artifact }}
          path: artifacts/retained

      - name: Build website candidate
        if: needs.receive.outputs.retained_site != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/site artifacts/site-payload
          python3 infrastructure/eng/website-delivery.py build-site \
            --source source \
            --output artifacts/site-content \
            --inventory infrastructure/eng/public-files.txt \
            --source-commit '${{ needs.receive.outputs.source_commit }}'
          archive="netwasm-website-v${{ needs.receive.outputs.version }}.zip"
          python3 infrastructure/eng/website-delivery.py pack-site \
            --source artifacts/site-content \
            --output "artifacts/site/$archive"
          cp "artifacts/site/$archive" "artifacts/site-payload/$archive"

      - name: Select retained website candidate
        if: needs.receive.outputs.retained_site == 'true'
        shell: bash
        run: |
          directory=artifacts/retained/website-site-candidate
          receipt="$directory/delivery-candidate-receipt.json"
          archive="$(jq -r '.archive.fileName' "$receipt")"
          mkdir -p artifacts/site
          cp "$receipt" artifacts/site/delivery-candidate-receipt.json
          cp "$directory/$archive" "artifacts/site/$archive"

      - name: Retain website candidate payload
        if: needs.receive.outputs.retained_site != 'true'
        id: payload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: website-site-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/site-payload/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Resolve website candidate producer job
        if: needs.receive.outputs.retained_site != 'true'
        id: producer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            > artifacts/site-jobs.json
          python3 infrastructure/eng/actions-delivery.py job-id \
            --jobs artifacts/site-jobs.json \
            --name site-candidate \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Record website candidate receipt
        if: needs.receive.outputs.retained_site != 'true'
        shell: bash
        run: |
          archive="$(find artifacts/site -maxdepth 1 -type f -name '*.zip' -printf '%f\n')"
          test -n "$archive"
          python3 infrastructure/eng/website-delivery.py candidate \
            --preparation artifacts/dispatch/release-preparation.json \
            --inputs artifacts/dispatch/inputs.json \
            --archive "artifacts/site/$archive" \
            --artifact-id '${{ steps.payload.outputs.artifact-id }}' \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --job-id '${{ steps.producer.outputs.job_id }}' \
            --actor-id "$GITHUB_ACTOR_ID" \
            --site-identity artifacts/site-content/site-identity.json \
            --output artifacts/site/delivery-candidate-receipt.json

      - name: Verify resolved website candidate
        id: verified
        shell: bash
        run: |
          receipt=artifacts/site/delivery-candidate-receipt.json
          archive="$(jq -r '.archive.fileName' "$receipt")"
          python3 infrastructure/eng/website-delivery.py verify-candidate \
            --preparation artifacts/dispatch/release-preparation.json \
            --inputs artifacts/dispatch/inputs.json \
            --receipt "$receipt" \
            --archive "artifacts/site/$archive" \
            --upstream-directory artifacts/dispatch/upstream \
            --github-output "$GITHUB_OUTPUT"

      - name: Retain resolved website for deployment
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: resolved-website-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/site/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Retain website candidate receipt
        if: needs.receive.outputs.retained_site != 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: delivery-candidate-receipt-website-site-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/site/delivery-candidate-receipt.json
          if-no-files-found: error
          retention-days: 90

  stage-site:
    needs: [receive, site-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      pages_artifact: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      site_artifact: website-site-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Reject native production reruns
        shell: bash
        run: |
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo 'Native production reruns are not supported. Resume through a fresh coordinator dispatch so retained candidates are authenticated.' >&2
            exit 1
          fi

      - name: Check out approved delivery infrastructure
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.receive.outputs.infrastructure_commit }}
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Download resolved website candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.site-candidate.outputs.artifact_name }}
          path: artifacts/site

      - name: Materialize exact website
        run: |
          python3 eng/website-delivery.py extract-site \
            --archive "artifacts/site/${{ needs.site-candidate.outputs.archive_name }}" \
            --output public
          test "$(sha256sum public/site-identity.json | cut -d ' ' -f 1)" = '${{ needs.site-candidate.outputs.site_identity_sha256 }}'

      - name: Retain exact website
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: website-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: public/
          if-no-files-found: error
          retention-days: 90

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: public

  predeploy:
    needs: [receive, site-candidate, stage-site]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reject native production reruns
        shell: bash
        run: |
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo 'Native production reruns are not supported. Resume through a fresh coordinator dispatch so retained candidates are authenticated.' >&2
            exit 1
          fi

      - name: Check out approved delivery infrastructure
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.receive.outputs.infrastructure_commit }}
          persist-credentials: false

      - name: Download exact website
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.stage-site.outputs.site_artifact }}
          path: public

      - name: Verify website before deployment
        run: |
          python3 eng/website-delivery.py verify-site --site public
          test "$(sha256sum public/site-identity.json | cut -d ' ' -f 1)" = '${{ needs.site-candidate.outputs.site_identity_sha256 }}'
          test "$(sha256sum public/index.html | cut -d ' ' -f 1)" = '${{ needs.site-candidate.outputs.index_html_sha256 }}'
          test "$(cat public/CNAME)" = www.netwasm.com

  deploy:
    needs: [stage-site, predeploy]
    runs-on: ubuntu-24.04
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject native production reruns
        shell: bash
        run: |
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo 'Native production reruns are not supported. Resume through a fresh coordinator dispatch so retained candidates are authenticated.' >&2
            exit 1
          fi

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: ${{ needs.stage-site.outputs.pages_artifact }}

  bind-deployment:
    needs: [receive, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      deployment_artifact: website-deployment-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      actions: read
      contents: read
      deployments: read
    steps:
      - name: Reject native production reruns
        shell: bash
        run: |
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo 'Native production reruns are not supported. Resume through a fresh coordinator dispatch so retained candidates are authenticated.' >&2
            exit 1
          fi

      - name: Check out approved delivery infrastructure
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.receive.outputs.infrastructure_commit }}
          persist-credentials: false

      - name: Bind exact Pages deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/deployment/statuses
          for attempt in {1..12}; do
            echo "Resolving exact Pages deployment (attempt $attempt of 12)"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
              > artifacts/deployment/jobs.json
            gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=100" \
              > artifacts/deployment/deployments.json
            while IFS= read -r deployment_id; do
              gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses?per_page=100" \
                > "artifacts/deployment/statuses/${deployment_id}.json"
            done < <(jq -r '.[].id' artifacts/deployment/deployments.json)
            if python3 eng/actions-delivery.py deployment \
              --jobs artifacts/deployment/jobs.json \
              --deployments artifacts/deployment/deployments.json \
              --statuses-directory artifacts/deployment/statuses \
              --repository "$GITHUB_REPOSITORY" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --job-name deploy \
              --head-sha "$GITHUB_SHA" \
              --workflow-ref "$GITHUB_REF_NAME" \
              --actor-id "$GITHUB_ACTOR_ID" \
              --expected-url "$PAGE_URL" \
              --output artifacts/deployment/deployment.json; then
              exit 0
            fi
            sleep 5
          done
          echo 'Exact Pages deployment did not become visible.' >&2
          exit 1

      - name: Retain exact deployment coordinates
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: website-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/deployment/deployment.json
          if-no-files-found: error
          retention-days: 90

  verify-live:
    needs: [receive, site-candidate, deploy, bind-deployment]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Reject native production reruns
        shell: bash
        run: |
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo 'Native production reruns are not supported. Resume through a fresh coordinator dispatch so retained candidates are authenticated.' >&2
            exit 1
          fi

      - name: Check out approved delivery infrastructure
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.receive.outputs.infrastructure_commit }}
          persist-credentials: false

      - name: Download coordinated dispatch evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.receive.outputs.dispatch_artifact }}
          path: artifacts/dispatch

      - name: Download exact deployment coordinates
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.bind-deployment.outputs.deployment_artifact }}
          path: artifacts/deployment

      - name: Wait for exact live website identity
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_INDEX_SHA256: ${{ needs.site-candidate.outputs.index_html_sha256 }}
          EXPECTED_SITE_IDENTITY_SHA256: ${{ needs.site-candidate.outputs.site_identity_sha256 }}
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            cache_bust="delivery=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            rm -rf /tmp/website-files
            mkdir -p /tmp/website-files
            if curl --fail --silent --show-error \
                 --output /tmp/site-identity.json \
                 "${PAGE_URL%/}/site-identity.json?${cache_bust}" && \
               curl --fail --silent --show-error \
                 --output /tmp/index.html \
                 "${PAGE_URL%/}/?${cache_bust}"; then
              identity_sha="$(sha256sum /tmp/site-identity.json | cut -d ' ' -f 1)"
              declared_index="$(jq -r '.indexHtmlSha256' /tmp/site-identity.json)"
              if [[ "$identity_sha" == "$EXPECTED_SITE_IDENTITY_SHA256" && \
                    "$declared_index" == "$EXPECTED_INDEX_SHA256" ]]; then
                files_ok=true
                while IFS= read -r file; do
                  encoded="$(python3 -c \
                    'import sys; from urllib.parse import quote; print(quote(sys.argv[1], safe="/"))' \
                    "$file")"
                  mkdir -p "/tmp/website-files/$(dirname "$file")"
                  if ! curl --fail --silent --show-error \
                       --output "/tmp/website-files/$file" \
                       "${PAGE_URL%/}/${encoded}?${cache_bust}"; then
                    files_ok=false
                    break
                  fi
                done < <(jq -r '.files | keys[] | select(. != "index.html")' \
                  /tmp/site-identity.json)
                if [[ "$files_ok" == true ]] && \
                   python3 eng/website-delivery.py verify-observed-site \
                     --identity /tmp/site-identity.json \
                     --index /tmp/index.html \
                     --files /tmp/website-files \
                     --expected-identity-sha256 "$EXPECTED_SITE_IDENTITY_SHA256" \
                     --expected-index-sha256 "$EXPECTED_INDEX_SHA256"; then
                  exit 0
                fi
              fi
            fi
            sleep 5
          done
          echo 'Expected website identity did not become live.' >&2
          exit 1

      - name: Resolve live website job
        id: live-job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            > artifacts/live-jobs.json
          python3 eng/actions-delivery.py job-id \
            --jobs artifacts/live-jobs.json \
            --name verify-live \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Record immutable live evidence
        run: |
          mkdir -p artifacts/live-evidence
          python3 eng/website-delivery.py live-evidence \
            --preparation artifacts/dispatch/release-preparation.json \
            --inputs artifacts/dispatch/inputs.json \
            --deployment artifacts/deployment/deployment.json \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --job-id '${{ steps.live-job.outputs.job_id }}' \
            --site-identity-sha256 '${{ needs.site-candidate.outputs.site_identity_sha256 }}' \
            --playground-completion-sha256 '${{ needs.receive.outputs.playground_completion_sha256 }}' \
            --output artifacts/live-evidence/delivery-evidence.json

      - name: Retain immutable live evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: delivery-evidence-website-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.live-job.outputs.job_id }}
          path: artifacts/live-evidence/delivery-evidence.json
          if-no-files-found: error
          retention-days: 90

  complete-delivery:
    needs: [receive, site-candidate, bind-deployment, verify-live]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Reject native production reruns
        shell: bash
        run: |
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo 'Native production reruns are not supported. Resume through a fresh coordinator dispatch so retained candidates are authenticated.' >&2
            exit 1
          fi

      - name: Check out approved delivery infrastructure
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.receive.outputs.infrastructure_commit }}
          persist-credentials: false

      - name: Download coordinated dispatch evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.receive.outputs.dispatch_artifact }}
          path: artifacts/dispatch

      - name: Download resolved website candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.site-candidate.outputs.artifact_name }}
          path: artifacts/site

      - name: Download exact deployment coordinates
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.bind-deployment.outputs.deployment_artifact }}
          path: artifacts/deployment

      - name: Collect immutable completion coordinates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            > artifacts/completion-jobs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            > artifacts/completion-artifacts.json
          live_job_id="$(python3 eng/actions-delivery.py job-id \
            --jobs artifacts/completion-jobs.json \
            --name verify-live \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$GITHUB_SHA")"
          evidence_name="delivery-evidence-website-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${live_job_id}"
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$evidence_name" \
            --dir artifacts/evidence
          python3 eng/actions-delivery.py completion-metadata \
            --jobs artifacts/completion-jobs.json \
            --artifacts artifacts/completion-artifacts.json \
            --evidence artifacts/evidence/delivery-evidence.json \
            --deployment artifacts/deployment/deployment.json \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --producer-job-name complete-delivery \
            --live-job-name verify-live \
            --head-sha "$GITHUB_SHA" \
            --dispatch-attempt-identity '${{ inputs.dispatch_attempt_identity }}' \
            --site-identity-sha256 '${{ needs.site-candidate.outputs.site_identity_sha256 }}' \
            --playground-completion-sha256 '${{ needs.receive.outputs.playground_completion_sha256 }}' \
            --output artifacts/completion-metadata.json

      - name: Record immutable delivery completion
        run: |
          mkdir -p artifacts/completion
          python3 eng/website-delivery.py completion \
            --preparation artifacts/dispatch/release-preparation.json \
            --inputs artifacts/dispatch/inputs.json \
            --metadata artifacts/completion-metadata.json \
            --site-receipt artifacts/site/delivery-candidate-receipt.json \
            --upstream-directory artifacts/dispatch/upstream \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --actor-id "$GITHUB_ACTOR_ID" \
            --output artifacts/completion/delivery-completion-receipt.json

      - name: Retain immutable delivery completion
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: delivery-completion-website-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/completion/delivery-completion-receipt.json
          if-no-files-found: error
          retention-days: 90
