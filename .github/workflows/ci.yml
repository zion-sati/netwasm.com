name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify delivery tooling
        run: |
          python3 -m py_compile eng/*.py eng/tests/*.py
          python3 -m unittest discover -s eng/tests -p 'test_*.py'
      - name: Build explicit public site
        run: |
          python3 eng/website-delivery.py build-site \
            --source . \
            --output .cache/site \
            --inventory eng/public-files.txt \
            --source-commit "$GITHUB_SHA"
          python3 eng/website-delivery.py verify-site --site .cache/site
